<!doctype html><html lang="fr"><meta charset="utf-8"><title>Suivi continu — test acoustique</title><style>body{font:18px system-ui;padding:2rem}pre{white-space:pre-wrap}button{padding:1rem}</style><h1>Suivi continu — test acoustique</h1><p>Trois extraits publics Al-Afasy 2:255 à 2:257. Aucun microphone. Inférence locale sans accès réseau HTTP.</p><button id="run">Tester les trois versets</button><pre id="output">Prêt.</pre><script type="module">
import Engine from '/scripts/tilawa-offline-worker.ts?worker';
import {downloadTilawaPack} from '/src/lib/tilawa/assets.ts';
const button=document.querySelector('#run'),output=document.querySelector('#output');
button.onclick=async()=>{button.disabled=true;let worker;const log=x=>output.textContent+='\n'+x;try{
 await downloadTilawaPack(()=>{});const ctx=new OfflineAudioContext(1,16000,16000);
 const clips=await Promise.all(['002255','002256','002257'].map(async id=>(await ctx.decodeAudioData(await(await fetch(`/scripts/fixtures/${id}.mp3`)).arrayBuffer())).getChannelData(0)));
 worker=new Engine();let id=0;const command=data=>new Promise((resolve,reject)=>{const current=++id;const timeout=setTimeout(()=>reject(Error('Timeout')),120000);worker.onmessage=({data:r})=>{if(r.id!==current)return;clearTimeout(timeout);r.error?reject(Error(r.error)):resolve(r);};worker.onerror=e=>reject(Error(e.message));worker.postMessage({...data,id:current});});
 await command({type:'begin'});const refs=[];const metrics=[];const started=performance.now();
 for(let i=0;i<clips.length;i++){log(`Analyse du verset 2:${255+i}…`);let firstCursor=null,updates=0,computeMs=0;const positions=new Set();for(let offset=0;offset<clips[i].length;offset+=7680){const tick=performance.now();const r=await command({type:'audio',samples:clips[i].slice(offset,offset+7680)});computeMs+=performance.now()-tick;for(const e of r.events){if(e.type==='verse_match'||e.type==='word_progress'){if(e.type==='word_progress'&&e.surah===2&&e.ayah===255+i){if(firstCursor===null)firstCursor=(offset+7680)/16000;updates++;positions.add(e.word_index);}const ref=`${e.surah}:${e.ayah}`;if(refs.at(-1)!==ref){refs.push(ref);log('Suivi : '+ref);}}}}metrics.push({verse:`2:${255+i}`,audioSeconds:clips[i].length/16000,firstCursorAudioSeconds:firstCursor,wordPositions:positions.size,wordEvents:updates,computeSeconds:computeMs/1000});log(JSON.stringify(metrics.at(-1)));}
 await command({type:'finish'});const expected=['2:255','2:256','2:257'];log(JSON.stringify({expected,recognized:refs,metrics,seconds:(performance.now()-started)/1000}));if(expected.some(ref=>!refs.includes(ref)))throw Error('Transition manquante');log('RÉUSSI : suivi de trois versets sans redémarrage du moteur.');
 }catch(e){log('ERREUR : '+e.message);}finally{worker?.terminate();button.disabled=false;}};
</script></html>
