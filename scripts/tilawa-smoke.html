<!doctype html><html lang="fr"><meta charset="utf-8"><title>Vérification locale Tilawa</title>
<style>body{font:18px system-ui;padding:2rem;max-width:70rem}button{padding:1rem}pre{white-space:pre-wrap}</style>
<h1>Vérification locale Tilawa</h1><p>Extrait public Al-Afasy 2:255. Aucun microphone. Les fichiers sont lus et analysés sur cet appareil.</p>
<button id="run">Tester le moteur réel</button><pre id="output">Prêt.</pre>
<script type="module">
import Engine from '/scripts/tilawa-offline-worker.ts?worker';
import {corpusWordOffset} from '/src/lib/tilawa/feedback.ts';
import {recitationWords} from '/src/lib/recitationMatching.ts';
import {downloadTilawaPack,tilawaPackStatus} from '/src/lib/tilawa/assets.ts';
const output=document.querySelector('#output');
const log=s=>{output.textContent+='\n'+s;};
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 try{
  log('Préparation du pack…');await downloadTilawaPack(()=>{});log('Pack: '+JSON.stringify(await tilawaPackStatus()));
  const context=new OfflineAudioContext(1,16000,16000);
  const audio=await context.decodeAudioData(await(await fetch('/scripts/fixtures/002255.mp3')).arrayBuffer());const samples=audio.getChannelData(0);
  log('Audio: '+audio.duration.toFixed(1)+' s, '+audio.sampleRate+' Hz');
  const expectedText=(await(await fetch('https://api.alquran.cloud/v1/ayah/2:255/quran-uthmani')).json()).data.text;
  const worker=new Engine();let id=0;
  const command=data=>new Promise((resolve,reject)=>{const current=++id;const timer=setTimeout(()=>reject(Error('Timeout')),120000);worker.onmessage=({data:r})=>{if(r.id!==current)return;clearTimeout(timer);r.error?reject(Error(r.error)):resolve(r);};worker.onerror=e=>reject(Error(e.message));worker.postMessage({...data,id:current});});
  for(const expected of [undefined,{surah:2,ayah:255}]){
   const start=performance.now();log(expected?'Correction 2:255…':'Recherche libre…');const init=await command({type:'begin',expected});log('Initialisé'+(init.words?' ('+init.words.length+' mots)':''));if(expected && corpusWordOffset(recitationWords(expectedText),init.words,2,255)!==0)throw Error('Alignement texte/corpus incompatible');
   const refs=new Set();let counts={},issues=[];
   function inspect(r){for(const e of r.events){if(e.type==='verse_match')refs.add(e.surah+':'+e.ayah);if(e.type==='final_sequence')for(const v of e.verses)refs.add(v.surah+':'+v.ayah);if(e.type==='correction'&&e.state.issue)issues.push(e.state.issue.kind);}
    counts=r.verdicts.reduce((a,v)=>(a[v.state]=(a[v.state]||0)+1,a),{});
   }
   for(let offset=0;offset<samples.length;offset+=7680)inspect(await command({type:'audio',samples:samples.slice(offset,offset+7680)}));
   inspect(await command({type:'finish'}));log(JSON.stringify({mode:expected?'correction':'search',seconds:+((performance.now()-start)/1000).toFixed(2),references:[...refs],counts,issues:[...new Set(issues)]}));
   if(!expected&&!refs.has('2:255'))throw Error('Passage attendu non identifié');
  }
  worker.terminate();log('TERMINÉ : moteur réel testé, alignement vérifié, aucun accès réseau HTTP du moteur.');
 }catch(e){log('ERREUR : '+e.message);}finally{document.querySelector('#run').disabled=false;}
};
</script></html>
